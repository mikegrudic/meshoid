[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "meshoid"
version = "1.51.1"
authors = [
  { name="Mike Grudić", email="mike.grudic@gmail.com" },
]
description = "Package for analysis of meshless simulation data"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
"astropy", "numba", "numpy", "scipy", "h5py"
]

license = "MIT"
license-files = ["LICEN[CS]E*"]

# numba.cuda is provided by the separate numba-cuda package, needed only for
# the optional backend="cuda" deposition
[project.optional-dependencies]
cuda = ["numba-cuda"]

[project.urls]
Homepage = "https://github.com/mikegrudic/meshoid"
Issues = "https://github.com/mikegrudic/meshoid/issues"